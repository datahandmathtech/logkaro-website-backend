<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Outer Phone Body -->
  <rect width="380" height="760" rx="44" fill="url(#phoneBody)" stroke="#334155" stroke-width="4"/>
  <rect x="10" y="10" width="360" height="740" rx="36" fill="url(#screenBg)"/>

  <!-- Dynamic Island -->
  <rect x="130" y="20" width="120" height="28" rx="14" fill="#000000"/>
  <circle cx="230" cy="34" r="5" fill="#1e293b"/>

  <!-- App Header -->
  <g transform="translate(25, 65)">
    <text x="0" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="900">LogKaro Driver OS</text>
    <rect x="230" y="2" width="100" height="22" rx="11" fill="rgba(16,185,129,0.2)"/>
    <circle cx="242" cy="13" r="3.5" fill="#10b981"/>
    <text x="250" y="17" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="800">DUTY ACTIVE</text>
  </g>

  <!-- Driver Info Card -->
  <g transform="translate(25, 105)">
    <rect width="330" height="70" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="36" cy="35" r="20" fill="rgba(245,158,11,0.2)"/>
    <text x="28" y="41" fill="#fbbf24" font-size="16">👨‍✈️</text>
    <text x="68" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Rohan Sharma</text>
    <text x="68" y="48" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">🚗 DL-01-AB-1001 • Dzire</text>
  </g>

  <!-- Active Tour Card -->
  <g transform="translate(25, 190)">
    <rect width="330" height="175" rx="14" fill="rgba(15,23,42,0.9)" stroke="rgba(245,158,11,0.3)"/>
    <rect x="14" y="14" width="70" height="20" rx="4" fill="rgba(245,158,11,0.2)"/>
    <text x="20" y="28" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="900">DUTY #8901</text>
    <text x="14" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="900">Delhi ➔ Agra ➔ Jaipur</text>
    <text x="14" y="78" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="12">Guest: Dr. A. Verma (4 Pax)</text>

    <!-- Odometer verification box -->
    <rect x="14" y="95" width="302" height="65" rx="8" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="115" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="10" font-weight="700">START ODOMETER (GPS LOCKED)</text>
    <text x="24" y="142" fill="#10b981" font-family="monospace" font-size="18" font-weight="900">1,42,850 KM</text>
    <rect x="220" y="112" width="85" height="32" rx="6" fill="rgba(16,185,129,0.2)"/>
    <text x="235" y="132" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="800">✓ VERIFIED</text>
  </g>

  <!-- Fuel Slip Camera Scan Upload -->
  <g transform="translate(25, 380)">
    <rect width="330" height="150" rx="14" fill="rgba(244,63,94,0.08)" stroke="rgba(244,63,94,0.3)"/>
    <text x="16" y="28" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="900">⛽ GUEST FUEL AUTO-NETTING</text>
    <text x="16" y="48" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="11">Did guest pay petrol pump? Snap slip:</text>
    
    <rect x="16" y="62" width="298" height="70" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(244,63,94,0.4)" stroke-dasharray="4 4"/>
    <text x="165" y="92" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">📷 Upload Fuel Pump Receipt</text>
    <text x="165" y="112" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">OCR reads IndianOil/HPCL amount instantly</text>
  </g>

  <!-- Guest Balance Due at Checkout -->
  <g transform="translate(25, 545)">
    <rect width="330" height="90" rx="14" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)"/>
    <text x="16" y="26" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="800">NET BALANCE DUE FROM GUEST</text>
    <text x="16" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="950">₹9,500</text>
    <text x="16" y="78" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="10">(₹15,000 - ₹2,000 Adv - ₹3,500 Fuel Slip)</text>

    <rect x="230" y="32" width="85" height="36" rx="8" fill="url(#accentGold)"/>
    <text x="272" y="55" fill="#030611" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">Collect QR</text>
  </g>

  <!-- Bottom Home Indicator -->
  <rect x="130" y="730" width="120" height="5" rx="2.5" fill="rgba(255,255,255,0.4)"/>
</svg>