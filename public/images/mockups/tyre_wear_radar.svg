<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="healthyWheel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="wornWheel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="16" fill="#060a19" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Top Title -->
  <g transform="translate(30, 30)">
    <text x="0" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900">4-Wheel Tyre Wear Lifecycle Radar</text>
    <text x="0" y="42" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="12">Vehicle: KA-03-EF-3030 (Tourer MPV) • Tyre Model: Apollo Alnac 4G 205/65 R16</text>
  </g>

  <!-- Car Chassis Top Down Wireframe -->
  <g transform="translate(240, 90)">
    <!-- Chassis Body -->
    <rect x="70" y="30" width="180" height="320" rx="40" fill="url(#chassisGrad)" stroke="rgba(56,189,248,0.4)" stroke-width="2"/>
    <path d="M90,70 L230,70 L210,130 L110,130 Z" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.3)"/>
    <path d="M100,280 L220,280 L210,320 L110,320 Z" fill="rgba(56,189,248,0.1)" stroke="rgba(56,189,248,0.3)"/>

    <!-- Wheel Front Left (FL) -->
    <rect x="25" y="60" width="35" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
    <!-- Wheel Front Right (FR) -->
    <rect x="260" y="60" width="35" height="75" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="3"/>

    <!-- Wheel Rear Left (RL) -->
    <rect x="25" y="245" width="35" height="75" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <!-- Wheel Rear Right (RR) -->
    <rect x="260" y="245" width="35" height="75" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>

    <!-- Axles -->
    <line x1="60" y1="97" x2="260" y2="97" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
    <line x1="60" y1="282" x2="260" y2="282" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

    <!-- Center Chassis Telemetry Indicator -->
    <circle cx="160" cy="190" r="30" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="2"/>
    <text x="160" y="195" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">SAFE</text>
  </g>

  <!-- FL Metric Callout -->
  <g transform="translate(30, 140)">
    <rect width="180" height="65" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)"/>
    <text x="14" y="22" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="800">FRONT LEFT (FL)</text>
    <text x="14" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900">8.4 mm (84%)</text>
    <text x="14" y="58" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="10">Serial: #AP-9011-FL</text>
  </g>

  <!-- FR Metric Callout -->
  <g transform="translate(590, 140)">
    <rect width="180" height="65" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)"/>
    <text x="14" y="22" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="800">FRONT RIGHT (FR)</text>
    <text x="14" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900">8.2 mm (82%)</text>
    <text x="14" y="58" fill="rgba(255,255,255,0.6)" font-family="system-ui, sans-serif" font-size="10">Serial: #AP-9012-FR</text>
  </g>

  <!-- RL Metric Callout -->
  <g transform="translate(30, 320)">
    <rect width="180" height="65" rx="8" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)"/>
    <text x="14" y="22" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="800">REAR LEFT (RL)</text>
    <text x="14" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900">4.6 mm (46%)</text>
    <text x="14" y="58" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10">Rotate in 1,200 KM</text>
  </g>

  <!-- RR Metric Callout -->
  <g transform="translate(590, 320)">
    <rect width="180" height="65" rx="8" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)"/>
    <text x="14" y="22" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="800">REAR RIGHT (RR)</text>
    <text x="14" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900">4.5 mm (45%)</text>
    <text x="14" y="58" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10">Rotate in 1,200 KM</text>
  </g>

  <!-- Bottom Settlement Callout -->
  <g transform="translate(30, 440)">
    <rect width="740" height="54" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.35)"/>
    <text x="20" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="900">1-Click Workshop Settlement:</text>
    <text x="240" y="32" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="13">Bill #8921 • ₹4,500 settled via HDFC Bank</text>
    <rect x="630" y="12" width="95" height="30" rx="6" fill="#10b981"/>
    <text x="677" y="31" fill="#030611" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">✓ SETTLED</text>
  </g>
</svg>